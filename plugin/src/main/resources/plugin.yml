# The Bukkit descriptor, deliberately not paper-plugin.yml: Paper's own
# descriptor drops the `commands:` section in favor of registering Brigadier
# commands from code, and that API is still experimental on 1.21.1 - opting into
# it would mean a warning, and warnings are errors here. The stable descriptor
# registers the command declaratively with no version-fragile API at all.
name: Loom
version: '0.1.0'
main: dev.loom.plugin.LoomPlugin
api-version: '1.21'
description: Gives Loom agents persistent player bodies in the world.

# `/loombody` drives live agents and, through `think`, spends a real model call on
# the mind. A command block with no `permission:` key is open to every sender:
# Bukkit's permission check short-circuits to "allowed" when the field is null, so
# the node below is what actually gates the command. `PluginDescriptorTest` fails
# the build if it goes missing again, because nothing else would notice.
#
# `/loomwatch` changes nothing and is still gated, for a different reason: what it
# shows is operator-only diagnostics - model names, prompt versions, and the mind's
# own reasoning - which is not something every sender on a server should be handed.
commands:
  loombody:
    description: Manages Loom's persistent player identity and its mind.
    permission: loom.body
    permission-message: /loombody drives Loom's agents and requires the loom.body permission.
    usage: |
      /loombody create <agentId>
      /loombody inspect <agentId>
      /loombody think <agentId>
      /loombody stop <agentId>
  loomwatch:
    description: Watches one living agent - energy, trigger, model, intent, and outcome.
    permission: loom.observe
    permission-message: /loomwatch watches Loom's agents and requires the loom.observe permission.
    usage: |
      /loomwatch <agentId>
      /loomwatch off
      /loomwatch

# One node per command, both defaulting to op. `loom.body` is deliberately not split
# per subcommand: every subcommand of it names a live agent and can disturb a research
# run. `/loomwatch` is the one read-only half there is, so it gets a node of its own -
# it only reads the record Loom already writes, and holding loom.observe cannot change
# an agent's energy, timing, decisions, or model routing.
permissions:
  loom.body:
    description: Drive Loom's bodies and the mind through /loombody.
    default: op
  loom.observe:
    description: Watch one agent through /loomwatch. Read-only.
    default: op
