name: contract

# Runs each runtime's full gate suite. That includes the conformance tests that
# validate the shared fixtures against contract/loom.schema.json and assert
# byte-for-byte round-trips - so if the schema and either side's bindings drift,
# the corresponding job fails - and, on the JVM side, the architecture rules that
# keep engine-specific code behind the body port and the cognition transport
# behind its port.
#
# The `body` job is the same discipline for the second contract: it runs the Node
# half of contract/body-control.schema.json's conformance suite, whose JVM half
# runs inside `plugin`. Neither job proves the other, which is the point - three
# hand-written descriptions of one wire agree only because the shared corpus makes them.
#
# The `research` job is a third, unrelated contract: the versioned shape of an
# experiment manifest. It validates every committed manifest against the exact
# generation that manifest declares, so a schema edit that would reject evidence
# already published fails here rather than being discovered by rewriting the
# evidence. It shares no types or dependencies with the other two.
#
# Coverage runs inside each runtime's own job and is checked against
# tools/coverage/floors.json; every report is uploaded as an artifact.
#
# The `bridge` job is the one no single suite can do alone: it starts the real
# Rust cognition service and drives the JVM bridge against it, so a disagreement
# the shared fixtures cannot express - line framing, a tag only one serializer
# emits - fails CI rather than surfacing on a server.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cognition:
    name: Rust cognition bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognition
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default 1.91.0
      - name: rustfmt --check
        run: cargo fmt --all --check
      - name: clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: conformance tests
        run: cargo test --all-features
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.5
      - name: Set up Node for the coverage check
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: coverage
        working-directory: .
        run: tools/coverage/run.sh rust
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: cognition/target/llvm-cov/
          if-no-files-found: ignore

  body:
    name: Node body-control protocol
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: body
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: body/package-lock.json
      # `ci` rather than `install`: it installs exactly the committed lockfile and
      # fails if package.json and the lockfile disagree, so a dependency added
      # without regenerating the lockfile fails here instead of resolving to
      # whatever is newest on the day the job runs.
      - name: Install the pinned tree
        run: npm ci
      - name: lint and tests
        run: npm run check
      - name: coverage
        working-directory: .
        run: tools/coverage/run.sh body
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-body
          path: body/coverage/
          if-no-files-found: ignore

  research:
    name: Research manifest schema versioning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: research/package-lock.json
      - name: Install the pinned tree
        run: npm ci
      - name: lint and tests
        run: npm run check
      - name: coverage
        working-directory: .
        run: tools/coverage/run.sh research
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-research
          path: research/coverage/
          if-no-files-found: ignore

  plugin:
    name: JVM plugin and body port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up Corretto 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('plugin/build.gradle.kts', 'plugin/settings.gradle.kts', 'plugin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Set up Node 22 for the speech acceptance peers
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install body dependencies
        working-directory: body
        run: npm ci
      - name: gate suite, conformance and architecture tests
        # `check` runs detekt, ktlint, ArchUnit, warnings-as-errors compile, and
        # the tests; all are configured to fail the build. It also writes the
        # JaCoCo report the coverage step checks.
        run: ./gradlew check --no-daemon --console=plain
      - name: coverage floors
        working-directory: .
        run: node tools/coverage/check.js jvm
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jvm
          path: plugin/build/reports/jacoco/
          if-no-files-found: ignore
      - name: Fail if an offline end-to-end acceptance was skipped
        # They run only where node and body deps exist, so a skip here proves nothing.
        run: |
          for suite in SpeechEndToEndTest GoalScenarioEndToEndTest GoalRefusalEndToEndTest GoalPursuitEndToEndTest; do
            report=build/test-results/test/TEST-dev.loom.plugin.$suite.xml
            grep -q 'skipped="0"' "$report" || {
              echo "the offline acceptance $suite did not run: $report" >&2
              exit 1
            }
          done
      - name: assemble the plugin jar
        # Proves the shipped artifact still builds, not just that sources compile.
        run: ./gradlew shadowJar --no-daemon --console=plain

  bridge:
    name: Mind and body, over a real socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
      - name: Set up Corretto 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('plugin/build.gradle.kts', 'plugin/settings.gradle.kts', 'plugin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Start the cognition service
        working-directory: cognition
        # Backgrounded and then waited for: the test needs the port accepting
        # before it runs, and a service that failed to bind must fail the job here
        # rather than as a skipped test.
        run: |
          cargo build --release --bin loom-cognition
          LOOM_COGNITION_ADDR=127.0.0.1:8642 ./target/release/loom-cognition &
          for _ in $(seq 1 50); do
            if nc -z 127.0.0.1 8642; then exit 0; fi
            sleep 0.2
          done
          echo "cognition service never bound 127.0.0.1:8642" >&2
          exit 1
      - name: One decision round-trip, mind to body
        working-directory: plugin
        # LOOM_COGNITION_ADDR is what opts LiveCognitionServiceTest in; without it
        # the test skips, which is why the bind check above is not optional.
        env:
          LOOM_COGNITION_ADDR: 127.0.0.1:8642
        run: ./gradlew test --tests 'dev.loom.mind.tcp.LiveCognitionServiceTest' --no-daemon --console=plain
      - name: Fail if the round-trip test was skipped
        working-directory: plugin
        # A skipped opt-in test passes silently, which would make this whole job
        # green while proving nothing.
        run: |
          report=build/test-results/test/TEST-dev.loom.mind.tcp.LiveCognitionServiceTest.xml
          grep -q 'skipped="0"' "$report" || {
            echo "the live round-trip test did not run: $report" >&2
            exit 1
          }
