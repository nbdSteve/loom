name: contract

# Runs each side's full gate suite. That includes the conformance tests that
# validate the shared fixtures against contract/loom.schema.json and assert
# byte-for-byte round-trips - so if the schema and either side's bindings drift,
# the corresponding job fails - and, on the JVM side, the architecture rules that
# keep engine-specific code behind the body port.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cognition:
    name: Rust cognition bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognition
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.91.0 --profile minimal --component clippy,rustfmt
          rustup default 1.91.0
      - name: rustfmt --check
        run: cargo fmt --all --check
      - name: clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: conformance tests
        run: cargo test --all-features

  plugin:
    name: JVM plugin and body port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - name: Set up Corretto 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      # The build compiles against a Mojang-mapped server that paperweight
      # downloads, remaps, and decompiles - a few hundred MB and several minutes
      # on a cold cache. Caching it keeps that cost off every run; the key is the
      # build script, since that is what pins the server version.
      - name: Cache paperweight and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-paperweight-${{ runner.os }}-${{ hashFiles('plugin/build.gradle.kts', 'plugin/settings.gradle.kts', 'plugin/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-paperweight-${{ runner.os }}-
      - name: gate suite, conformance and architecture tests
        # `check` runs detekt, ktlint, ArchUnit, warnings-as-errors compile, and
        # the tests; all are configured to fail the build.
        run: ./gradlew check --no-daemon --console=plain
      - name: assemble the plugin jar
        # Proves the shipped artifact still builds, not just that sources compile.
        run: ./gradlew shadowJar --no-daemon --console=plain
