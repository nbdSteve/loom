[package]
name = "loom-cognition"
description = "The mind: accepts a bounded Perception over the Loom contract and returns a routed, provenance-stamped Decision."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
loom-contract = { path = "../contract" }
# The provider client. Default features are off so the TLS backend is a choice
# rather than whatever the default is; `json` is what carries the request body,
# and it must be declared here even though a dev-dependency happens to enable it
# for the test profile - without it `cargo build` fails while `cargo test` passes.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Async runtime for the request/response service. `net` and `io-util` carry the
# TCP listener and the buffered line reader the newline-delimited JSON wire uses.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }

[dev-dependencies]
# Validates the schema Loom sends the provider against the shared contract
# fixtures, so the two cannot drift apart silently.
jsonschema = "0.26"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
